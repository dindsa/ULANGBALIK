const DECK=[...G.map(c=>['g',...c]),...Y.map(c=>['y',...c]),...B.map(c=>['b',...c])];
let pile=[];
function draw(){if(!pile.length){pile=DECK.slice();for(let i=pile.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pile[i],pile[j]]=[pile[j],pile[i]]}}return pile.pop()}
const $=id=>document.getElementById(id),sl=ms=>new Promise(r=>setTimeout(r,ms));
let P=[],cur=0,busy=false;
function pos(n){n=Math.max(n,1);let r=Math.floor((n-1)/7),c=(n-1)%7;if(r%2)c=6-c;return[(c+.5)*100/7,(6-r+.5)*100/7]}
function place(i){const[x,y]=pos(P[i].pos),t=$('t'+i);t.style.left=(x+OX[i])+'%';t.style.top=(y+OY[i])+'%'}
function chips(){$('chips').innerHTML=P.map((p,i)=>`<div class="chip ${i===cur?'on':''}"><span class="dot" style="background:${COL[i]}"></span>${IC[i]} ${NM[i]}</div>`).join('')}
function msg(t){$('msg').textContent=t}
function show(c){
 $('kc').className=c[0];$('kh').textContent=c[0]==='b'?'🔵 Kartu Congklak':'❓ Kartu Pertanyaan';$('qt').textContent=c[1];
 const qa=$('qa'),end=v=>{$('q').style.display='none';return v};$('q').style.display='flex';
 return new Promise(res=>{
  if(c[0]==='b'){qa.innerHTML=`<div class="row"><button id="w">🏆 Menang (maju ${c[2]})</button><button class="alt" id="l">Kalah</button></div>`;$('w').onclick=()=>res(end(true));$('l').onclick=()=>res(end(false))}
  else{qa.innerHTML=`<input id="ans" type="number" inputmode="numeric" placeholder="Jawaban"><br><button id="go">Jawab</button>`;
   const go=()=>{const a=$('ans').value;if(a==='')return;const ok=Number(a)===c[2];qa.innerHTML=`<p>${ok?'✅ Benar!':'❌ Salah. Jawaban: '+c[2]}</p><button id="nx">Lanjut</button>`;$('nx').onclick=()=>res(end(ok))};
   $('go').onclick=go;$('ans').onkeydown=e=>{if(e.key==='Enter')go()};$('ans').focus()}
 })
}
const IC=[],ALLI=['🐱','🐶','🐰','🦊','🐼','🐸','🐯','🦁','🐵','🐧','🐢','🦄','⭐','🚀','⚽','🌸'],PAL=['#e63946','#1d4ed8','#7e22ce','#111827','#ffffff','#8b5a2b','#16a34a','#f59e0b','#ec4899','#06b6d4'];
const SET0=$('setup').innerHTML;
let cfg=[];
function ring(c){const n=parseInt(c.slice(1),16);return .3*(n>>16)+.59*((n>>8)&255)+.11*(n&255)>200?'#111':'#fff'}
function nm(i,v){cfg[i].name=v.replace(/[<>&"]/g,'')}
function pickC(i,k){cfg[i].col=PAL[k];design()}
function pickI(i,k){cfg[i].ic=ALLI[k];design()}
function design(){
 const sw=(i,arr,fn,col)=>arr.map((x,k)=>{const used=cfg.some((o,j)=>j!==i&&(col?o.col:o.ic)===x),s=(col?cfg[i].col:cfg[i].ic)===x;return `<button class='${s?'sel':''}' ${used?'disabled':''} onclick='${fn}(${i},${k})' ${col?`style='background:${x}'`:''}>${col?'':x}</button>`}).join('');
 $('setup').innerHTML=`<p><b>Buat pionmu!</b></p>`+cfg.map((c,i)=>`<div class='pw'><div class='pv' style='background:${c.col};box-shadow:0 0 0 2px ${ring(c.col)}'>${c.ic}</div><div class='pf'><input value='${c.name}' maxlength='10' placeholder='Nama pemain ${i+1}' oninput='nm(${i},this.value)'><div class='sw'>${sw(i,PAL,'pickC',1)}</div><div class='sw'>${sw(i,ALLI,'pickI',0)}</div></div></div>`).join('')+`<div class='row'><button class='alt' onclick='reset()'>Kembali</button><button onclick='go()'>Mulai</button></div>`;
}
function start(n){cfg=Array.from({length:n},(_,i)=>({name:NM[i],col:COL[i],ic:ALLI[i]}));design()}
function go(){const n=cfg.length;cfg.forEach((c,i)=>{NM[i]=c.name.trim()||'Pemain '+(i+1);COL[i]=c.col;IC[i]=c.ic});
 P=Array.from({length:n},()=>({pos:0}));cur=0;busy=false;pile=[];
 $('setup').style.display='none';$('game').style.display='block';$('over').style.display='none';
 document.querySelectorAll('.tok').forEach(e=>e.remove());
 P.forEach((_,i)=>{const t=document.createElement('div');t.className='tok';t.id='t'+i;t.style.background=COL[i];t.textContent=IC[i];t.style.boxShadow=`0 0 0 2px ${ring(COL[i])},0 2px 5px #0008`;$('board').appendChild(t);place(i)});
 chips();msg('Giliran '+NM[0]+' — tekan Lempar Dadu');$('btn').disabled=false;$('dice').textContent='⚀';
}
function reset(){$('setup').innerHTML=SET0;$('over').style.display='none';$('q').style.display='none';$('game').style.display='none';$('setup').style.display='block'}
async function walk(i,n){const p=P[i];for(let s=0;s<n;s++){p.pos++;place(i);await sl(200)}
 const j=SN[p.pos]??LD[p.pos];if(!j)return'';const naik=j>p.pos,t=naik?`🪜 ${NM[i]} naik tangga ke ${j}!`:`🐍 ${NM[i]} digigit ular, turun ke ${j}!`;
 msg(t);await sl(500);p.pos=j;place(i);await sl(600);return t+' '}
function won(i){if(P[i].pos===END){$('win').textContent=`🎉 ${NM[i]} menang!`;$('over').style.display='flex';return true}return false}
async function turn(){
 if(busy)return;busy=true;$('btn').disabled=true;
 let v;for(let k=0;k<8;k++){v=1+Math.floor(Math.random()*6);$('dice').textContent=F[v-1];await sl(70)}
 const p=P[cur],name=NM[cur];let m=`${name} dapat ${v}. `;
 if(p.pos+v>END){m+=`Butuh angka pas untuk sampai ${END}.`}
 else{
  m+=await walk(cur,v);if(won(cur))return;
  if(p.pos>=3&&p.pos<=47&&p.pos%2){
   const c=draw(),r=await show(c);
   if(c[0]==='b'){
    if(!r)m+=`Kalah congklak, tetap di kotak ${p.pos}.`;
    else if(p.pos+c[2]>END)m+=`Menang congklak, tapi butuh angka pas ke ${END}.`;
    else{m+=`Menang congklak, maju ${c[2]} petak. `;m+=await walk(cur,c[2]);if(won(cur))return}
   }else if(r)m+=`Jawaban benar, menempati kotak ${p.pos}.`;
   else{p.pos--;place(cur);await sl(400);m+=`Jawaban salah, mundur ke kotak ${p.pos}.`}
  }
 }
 if(v===6){m+=' Dapat 6, lempar lagi!'}else{cur=(cur+1)%P.length;m+=` Giliran ${NM[cur]}.`}
 chips();msg(m);busy=false;$('btn').disabled=false;
}
